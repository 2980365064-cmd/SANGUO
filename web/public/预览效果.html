<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>标注效果预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Source Han Serif", "Noto Serif SC", serif; background: #1a1610; color: #e8d9b5; }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; margin-bottom: 20px; color: #f2deb5; font-size: 24px; }
  .controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .controls button { padding: 10px 20px; border: 1px solid #6d5539; background: #3a3225; color: #e8d9b5; cursor: pointer; border-radius: 4px; font-size: 13px; }
  .controls button:hover { background: #7a382e; }
  .controls button.active { background: #6d3528; border-color: #bd9352; }
  .map-container { position: relative; background: #0a0806; border: 1px solid #6d5539; border-radius: 6px; overflow: hidden; }
  .map-container img { display: block; width: 100%; height: auto; }
  .map-container svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .info-panel { margin-top: 20px; padding: 16px; background: #2a2418; border: 1px solid #6d5539; border-radius: 6px; }
  .info-panel h3 { color: #c9a878; margin-bottom: 10px; font-size: 15px; }
  .info-panel ul { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .info-panel li { padding: 8px 12px; background: #1a1610; border-radius: 4px; border-left: 3px solid #8c6a3d; font-size: 12px; }
  .info-panel li.done { border-left-color: #4CAF50; }
  .info-panel li.partial { border-left-color: #FFA500; }
  .info-panel li.empty { border-left-color: #666; opacity: 0.6; }
  .legend { display: flex; justify-content: center; gap: 20px; margin-top: 16px; font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 16px; height: 10px; display: inline-block; }
  .legend i.province { background: rgba(184, 138, 58, 0.5); border: 2px solid #b88a3a; }
  .legend i.city { background: rgba(76, 175, 80, 0.4); border: 2px dashed #4CAF50; }
  .legend i.snapped { background: #4CAF50; }
  .no-data { text-align: center; padding: 40px; color: #8a7a60; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>🏯 标注效果预览</h1>

  <div class="controls">
    <button id="btnProvince" class="active" onclick="showLayer('province')">️ 州界</button>
    <button id="btnCity" class="active" onclick="showLayer('city')">🏯 城池</button>
    <button id="btnBoth" onclick="showLayer('both')"> 全部显示</button>
    <button onclick="clearStorageAndReload()">清缓存重载</button>
    <button onclick="syncData()">💾 同步数据</button>
    <button onclick="exportData()">⬇ 导出数据</button>
  </div>

  <div class="map-container">
    <img id="map" src="./底图_preview.jpg?v=20260718-retouch" alt="底图">
    <svg id="svg" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
  </div>

  <div class="legend">
    <span><i class="province"></i> 州界</span>
    <span><i class="city"></i> 城池范围</span>
    <span><i class="snapped"></i> 标注点</span>
  </div>

  <div class="info-panel">
    <h3>📊 标注统计</h3>
    <ul id="statsList"></ul>
  </div>

  <div class="info-panel" style="margin-top: 12px;">
    <h3>📋 详细数据</h3>
    <textarea id="dataOutput" style="width: 100%; height: 200px; padding: 10px; background: #1a1610; border: 1px solid #6d5539; color: #e8d9b5; font-family: monospace; font-size: 11px; resize: vertical;" readonly></textarea>
  </div>
</div>

<script src="./annotation_path_utils.js?v=20260718-single-city-fallback"></script>
<script>
const STORAGE_KEY = 'sanguo_map_annotation_v1';
const PROVINCES = ['凉州', '并州', '幽州', '冀州', '青州', '司隶', '州', '徐州', '豫州', '荆州', '扬州', '益州', '交州'];
const CITIES_BY_PROVINCE = {
  '凉州': ['姑藏'], '并州': ['晋阳', '九原'], '幽州': ['襄平', '蓟县'],
  '冀州': ['南皮', '邺城'], '青州': ['临淄'], '司隶': ['长安', '洛阳', '许昌'],
  '兖州': ['陈留', '谯县'], '徐州': ['下邳'], '豫州': ['宛城', '襄阳'],
  '荆州': ['江陵', '柴桑'], '扬州': ['合肥', '秣陵'], '益州': ['成都', '梓潼', '江州', '南郑', '上庸'],
  '交州': ['番禺'],
};
const ALL_CITIES = Object.values(CITIES_BY_PROVINCE).flat();

let provincePoints = {};
let cityPoints = {};
let currentLayer = 'both';

function applyAnnotationData(data) {
  provincePoints = data.provincePoints || {};
  cityPoints = data.cityPoints || {};
  return Object.keys(provincePoints).length > 0 || Object.keys(cityPoints).length > 0;
}

async function fetchAnnotationData(path) {
  const response = await fetch(path, { cache: 'no-store' });
  if (!response.ok) throw new Error(`${path} HTTP ${response.status}`);
  return response.json();
}

// 加载数据：预览页默认读取随项目提交的标注文件，避免旧 localStorage 继续显示历史乱线。
// 如需查看标注工具未同步的本地缓存，可在 URL 后加 ?useStorage=1。
async function loadData() {
  if (new URLSearchParams(window.location.search).get('useStorage') === '1') {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (applyAnnotationData(data)) return true;
      }
    } catch (e) {
      console.warn('本地缓存加载失败，将尝试读取 annotation_data.json:', e);
    }
  }

  for (const path of ['./annotation_data.json', './标注数据_交接.json']) {
    try {
      if (applyAnnotationData(await fetchAnnotationData(path))) return true;
    } catch (e) {
      console.warn(`${path} 加载失败:`, e);
    }
  }
  return false;
}

function rawPointsToPath(points) {
  if (!points || points.length < 3) return null;
  return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ') + ' Z';
}

// 州界在人工顺序和自动重排之间选择更短、更少交叉的候选路径。
function provincePointsToPath(points) {
  if (!points || points.length < 3) return null;
  return window.annotationPathUtils.provincePointsToSvgPath(points);
}

// 城池点可能来自共享边界或 localStorage 旧数据，先整理成无自交轮廓。
function pointsToPath(points) {
  if (!points || points.length < 3) return null;
  return window.annotationPathUtils.pointsToSvgPath(points);
}

function getCityPoints(city) {
  return window.annotationPathUtils.getCityBoundaryPoints(city, cityPoints, provincePoints);
}

function getVisibleCities() {
  return [...new Set([...ALL_CITIES, ...Object.keys(cityPoints)])];
}

// 计算中心点
function getCenter(points) {
  if (!points || points.length === 0) return { x: 0, y: 0 };
  const cx = Math.round(points.reduce((s, p) => s + p.x, 0) / points.length);
  const cy = Math.round(points.reduce((s, p) => s + p.y, 0) / points.length);
  return { x: cx, y: cy };
}

// 渲染地图
function renderMap() {
  const svg = document.getElementById('svg');
  svg.innerHTML = '';

  // 渲染州界
  if (currentLayer === 'province' || currentLayer === 'both') {
    for (const [province, points] of Object.entries(provincePoints)) {
      if (!points || points.length < 3) continue;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', provincePointsToPath(points));
      path.setAttribute('fill', 'rgba(184, 138, 58, 0.25)');
      path.setAttribute('stroke', '#b88a3a');
      path.setAttribute('stroke-width', '2.5');
      path.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(path);

      // 标注点
      points.forEach(p => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', p.y);
        circle.setAttribute('r', '4');
        circle.setAttribute('fill', '#b88a3a');
        svg.appendChild(circle);
      });

      // 州名标签
      const center = getCenter(points);
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', center.x);
      text.setAttribute('y', center.y);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('fill', '#f2deb5');
      text.setAttribute('font-size', '18');
      text.setAttribute('font-weight', 'bold');
      text.setAttribute('paint-order', 'stroke');
      text.setAttribute('stroke', '#1a1610');
      text.setAttribute('stroke-width', '3');
      text.textContent = province;
      svg.appendChild(text);
    }
  }

  // 渲染城池
  if (currentLayer === 'city' || currentLayer === 'both') {
    for (const city of getVisibleCities()) {
      const points = getCityPoints(city);
      if (!points || points.length < 3) continue;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pointsToPath(points));
      path.setAttribute('fill', 'rgba(76, 175, 80, 0.2)');
      path.setAttribute('stroke', '#4CAF50');
      path.setAttribute('stroke-width', '2');
      path.setAttribute('stroke-dasharray', '6 4');
      svg.appendChild(path);

      // 标注点
      points.forEach(p => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', p.y);
        circle.setAttribute('r', '3.5');
        circle.setAttribute('fill', '#4CAF50');
        svg.appendChild(circle);
      });

      // 城池名标签
      const center = getCenter(points);
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', center.x);
      text.setAttribute('y', center.y + 5);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('fill', '#e8f5e9');
      text.setAttribute('font-size', '13');
      text.setAttribute('font-weight', 'bold');
      text.setAttribute('paint-order', 'stroke');
      text.setAttribute('stroke', '#1a1610');
      text.setAttribute('stroke-width', '2.5');
      text.textContent = city;
      svg.appendChild(text);
    }
  }
}

// 更新统计
function updateStats() {
  const statsList = document.getElementById('statsList');
  let html = '';

  // 州统计
  html += '<li style="grid-column: 1/-1; background: #3a2820; font-weight: bold;">🗺️ 州界标注</li>';
  PROVINCES.forEach(p => {
    const points = provincePoints[p];
    const count = points ? points.length : 0;
    const status = count >= 3 ? 'done' : (count > 0 ? 'partial' : 'empty');
    const statusText = count >= 3 ? `✓ 已完成 (${count}点)` : (count > 0 ? `◐ 进行中 (${count}点)` : '○ 未标注');
    html += `<li class="${status}">${p}: ${statusText}</li>`;
  });

  // 城池统计
  html += '<li style="grid-column: 1/-1; background: #2a3a20; font-weight: bold; margin-top: 8px;">🏯 城池标注</li>';
  getVisibleCities().forEach(c => {
    const points = getCityPoints(c);
    const count = points ? points.length : 0;
    const status = count >= 3 ? 'done' : (count > 0 ? 'partial' : 'empty');
    const statusText = count >= 3 ? `✓ 已完成 (${count}点)` : (count > 0 ? `◐ 进行中 (${count}点)` : '○ 未标注');
    html += `<li class="${status}">${c}: ${statusText}</li>`;
  });

  statsList.innerHTML = html;
}

// 更新数据输出
function updateDataOutput() {
  let code = '// 标注数据\n\n';

  code += 'export const PROVINCE_BLOCKS = {\n';
  for (const p of PROVINCES) {
    const pts = provincePoints[p];
    if (!pts || pts.length < 3) {
      code += `  // "${p}": 未标注\n`;
      continue;
    }
    const center = getCenter(pts);
    const d = provincePointsToPath(pts);
    code += `  "${p}": { d: "${d}", cx: ${center.x}, cy: ${center.y}, labelX: ${center.x}, labelY: ${center.y} },\n`;
  }
  code += '};\n\n';

  code += 'export const CITY_BLOCKS = {\n';
  for (const c of getVisibleCities()) {
    const pts = getCityPoints(c);
    if (!pts || pts.length < 3) {
      code += `  // "${c}": 未标注\n`;
      continue;
    }
    const center = getCenter(pts);
    const province = Object.entries(CITIES_BY_PROVINCE).find(([, cities]) => cities.includes(c))?.[0] || '';
    const d = pointsToPath(pts);
    code += `  "${c}": { d: "${d}", cx: ${center.x}, cy: ${center.y}, province: "${province}" },\n`;
  }
  code += '};\n';

  document.getElementById('dataOutput').value = code;
}

// 切换图层
function showLayer(layer) {
  currentLayer = layer;
  document.getElementById('btnProvince').classList.toggle('active', layer === 'province' || layer === 'both');
  document.getElementById('btnCity').classList.toggle('active', layer === 'city' || layer === 'both');
  document.getElementById('btnBoth').classList.toggle('active', layer === 'both');
  renderMap();
}

function clearStorageAndReload() {
  localStorage.removeItem(STORAGE_KEY);
  window.location.href = window.location.pathname;
}

// 同步数据到文件
function syncData() {
  const data = { provincePoints, cityPoints };
  fetch('/api/save-annotation', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {
    if (res.ok) {
      alert('✅ 数据已同步！开发者可以查看效果了');
    } else {
      alert('❌ 同步失败：' + (res.error || '未知错误'));
    }
  })
  .catch(err => {
    alert('❌ 同步失败：' + err.message);
  });
}

// 导出数据
function exportData() {
  const data = document.getElementById('dataOutput').value;
  navigator.clipboard.writeText(data).then(() => {
    alert('数据已复制到剪贴板！');
  }).catch(() => {
    document.getElementById('dataOutput').select();
    alert('请手动复制文本框中的内容');
  });
}

// 初始化
(async function init() {
  if (await loadData()) {
    renderMap();
    updateStats();
    updateDataOutput();
  } else {
    document.querySelector('.map-container').innerHTML = '<div class="no-data">暂无标注数据，请先在标注工具中标注</div>';
  }
}());
</script>
</body>
</html>
